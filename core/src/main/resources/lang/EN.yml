gui:
  title: "&0KTPlus Effects"
  categories:
    common:
      display-name: "&fCommon"
    non-common:
      display-name: "&9Non-Common"
    rare:
      display-name: "&6Rare"
    very-rare:
      display-name: "&aVery Rare"
    epic:
      display-name: "&5Epic"
    legendary:
      display-name: "&bLegendary"
    ultra:
      display-name: "&4Ultra"
  buttons:
    scroll-up:
      name: "&eScroll Up"
    scroll-up-disabled:
      name: "&8Scroll Up"
    scroll-down:
      name: "&eScroll Down"
    scroll-down-disabled:
      name: "&8Scroll Down"
    filter:
      name: "&6Filter &8| {mode}"
    preview:
      name: "<gradient:#67e8f9:#38bdf8>Preview</gradient>"
    search:
      name: "<#fbbf24>Search</#fbbf24>"
      active: "&eSearch: &f{query}"
    favorites:
      name: "<gradient:#f472b6:#fb7185>Favorites</gradient>"
      active: "&dFavorites &aON"
    close:
      name: "&cClose"
    clear:
      name: "&cClear Effect"
    balance:
      name: "&6Coins: &f{balance}"
  button-lore:
    preview:
      - "&7Play a private preview"
      - "&7of your last / selected effect."
      - "&8"
      - "&eClick &7to preview (only you see it)"
    search:
      - "&7Filter effects by name or id."
      - "&8"
      - "&eLeft-click &7type a query in chat"
      - "&eRight-click &7clear search"
      - "&7In chat type &fcancel &7to abort"
    favorites:
      - "&7Show only favorited effects."
      - "&8"
      - "&eClick &7toggle favorites filter"
      - "&eRight-click effect &7to favorite"
    close:
      - "&7Close the effects menu."
    clear:
      - "&7Unequip your selected kill effect."
      - "&8"
      - "&eClick &7to clear"
    balance:
      - "&7Your KillCoins balance."
      - "&8"
      - "&eClick &7to print balance in chat"
    filter:
      - "&7Sort for &fthis category &7only"
      - "&eLeft-click &7next option"
      - "&eRight-click &7previous option"
      - "&8"
      - "{modes}"
  texts:
    empty-effect:
      name: "&f "
    filter-mode-active: "&a▶ {label}"
    filter-mode-inactive: "&8  {label}"
    filter-modes:
      NONE: "None"
      NAME_ASC: "Name A → Z"
      NAME_DESC: "Name Z → A"
      PRICE_ASC: "Price ↑"
      PRICE_DESC: "Price ↓"
      FREE_FIRST: "Free first"
      UNLOCKED_FIRST: "Unlocked first"
      LOCKED_FIRST: "Locked first"
      AFFORDABLE_FIRST: "Affordable first"
      SELECTED_FIRST: "Selected first"
      HEAVY_FIRST: "Heavy first"
      ID_ASC: "ID A → Z"
    effect-item:
      name: "<gradient:#38bdf8:#a78bfa>{name}</gradient>"
      lore:
        - "{description}"
        - "{category}"
        - "{status}"
        - "{price}"
        - "{lock}"
        - "{favorite}"
        - "&8"
        - "&eLeft-click &7select"
        - "&eRight-click &7favorite"
        - "&eShift-click &7preview"
      status-selected: "&aSelected"
      status-click: "&7Click to select"
      price-free: "&7Price: &aFree"
      price-paid: "&7Price: &f{price} coins"
      lock-unlocked: "&aUnlocked"
      lock-locked: "&cLocked"
      favorite-on: "<#f472b6>★ Favorited</#f472b6>"
      favorite-off: "&8☆ Favorite"

