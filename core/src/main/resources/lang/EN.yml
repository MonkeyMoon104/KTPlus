# KTPlus language pack (canonical schema).
# Copy as IT.yml / ES.yml / ... using ONLY two uppercase letters + .yml

prefix: "&8[&bKT+&8] &7"
no-permission: "&cYou do not have permission."
player-only: "&cOnly players can use this command."
player-not-found: "&cPlayer not found."
unknown-effect: "&cUnknown effect: &f%effect%&c."
effect-selected: "&aSelected effect: &f%effect%&a."
effect-cleared: "&aYour kill effect has been cleared."
reload-complete: "&aKT+ reloaded."
not-enough-coins: "&cYou need &f%price% &ccoins for this effect."
effect-purchased: "&aPurchased and selected &f%effect%&a."
effect-locked: "&cThis effect is locked."
killcoins-balance: "&a%player% has &f%balance% &acoins."
killcoins-updated: "&aUpdated balance for &f%player%&a."
effect-test-started: "&aTesting effect: &f%effect%&a."
effect-test-failed: "&cCould not start &f%effect%&c (server load limit). Try again in a moment."
headcollector-inherited: "&aYou inherited &f%amount% &aheads."

# --- disable/enable ---
effect-already-disabled: "&cEffect &f%effect% &cis already disabled."
effect-already-enabled: "&cEffect &f%effect% &cis already enabled."
effect-disabled-ok: "&aDisabled effect: &f%effect%&a."
effect-enabled-ok: "&aEnabled effect: &f%effect%&a."
effect-disabled-cleared: "&cYour selected effect &f%effect% &cwas disabled. You have no effect selected."

gui:
  title: "&0KTPlus Effects"
  categories:
    common:
      display-name: "&fCommon"
    non-common:
      display-name: "&9Non-Common"
    rare:
      display-name: "&6Rare"
    very-rare:
      display-name: "&aVery Rare"
    epic:
      display-name: "&5Epic"
    legendary:
      display-name: "&bLegendary"
    ultra:
      display-name: "&4Ultra"
  buttons:
    scroll-up:
      name: "&eScroll Up"
    scroll-up-disabled:
      name: "&8Scroll Up"
    scroll-down:
      name: "&eScroll Down"
    scroll-down-disabled:
      name: "&8Scroll Down"
    filter:
      name: "&6Filter &8| {mode}"
    close:
      name: "&cClose"
    clear:
      name: "&cClear Effect"
    balance:
      name: "&6Coins: &f{balance}"
  texts:
    empty-effect:
      name: "&f "
    filter-mode-active: "&a▶ {label}"
    filter-mode-inactive: "&8  {label}"
    filter-modes:
      NONE: "None"
      NAME_ASC: "Name A → Z"
      NAME_DESC: "Name Z → A"
      PRICE_ASC: "Price ↑"
      PRICE_DESC: "Price ↓"
      FREE_FIRST: "Free first"
      UNLOCKED_FIRST: "Unlocked first"
      LOCKED_FIRST: "Locked first"
      AFFORDABLE_FIRST: "Affordable first"
      SELECTED_FIRST: "Selected first"
      HEAVY_FIRST: "Heavy first"
      ID_ASC: "ID A → Z"
    effect-item:
      name: "&b{name}"
      lore:
        - "{description}"
        - "{category}"
        - "{status}"
        - "{price}"
        - "{lock}"
      status-selected: "&aSelected"
      status-click: "&7Click to select"
      price-free: "&7Price: &aFree"
      price-paid: "&7Price: &f{price} coins"
      lock-unlocked: "&aUnlocked"
      lock-locked: "&cLocked"
  button-lore:
    filter:
      - "&7Sort for &fthis category &7only"
      - "&eLeft-click &7next option"
      - "&eRight-click &7previous option"
      - "&8"
      - "{modes}"

