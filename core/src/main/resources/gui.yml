title: "&0KTPlus Effects"

rows: 6

structure:
  - "#########"
  - "#EEEEEEEU"
  - "#EEEEEEE#"
  - "#EEEEEEE#"
  - "#EEEEEEED"
  - "F#C#Q#B#"

ingredients:
  "#":
    type: border
    material: BLACK_STAINED_GLASS_PANE
    name: "&0 "
  "E":
    type: effect
  "U":
    type: button
    button: scroll-up
  "D":
    type: button
    button: scroll-down
  "F":
    type: button
    button: filter
  "C":
    type: button
    button: close
  "Q":
    type: button
    button: clear
  "B":
    type: button
    button: balance

category-slots:
  - 64
  - 65
  - 66
  - 67
  - 68
  - 69
  - 70

categories:
  common:
    display-name: "&fCommon"
    tab-icon: IRON_INGOT
  non-common:
    display-name: "&9Non-Common"
    tab-icon: LAPIS_LAZULI
  rare:
    display-name: "&6Rare"
    tab-icon: GOLD_INGOT
  very-rare:
    display-name: "&aVery Rare"
    tab-icon: EMERALD
  epic:
    display-name: "&5Epic"
    tab-icon: AMETHYST_SHARD
  legendary:
    display-name: "&bLegendary"
    tab-icon: DIAMOND
  ultra:
    display-name: "&4Ultra"
    tab-icon: NETHERITE_INGOT

buttons:
  scroll-up:
    material: ARROW
    name: "&eScroll Up"
    name-disabled: "&8Scroll Up"
  scroll-down:
    material: ARROW
    name: "&eScroll Down"
    name-disabled: "&8Scroll Down"
  filter:
    material: HOPPER
    name: "&6Filter &8| {mode}"
    lore:
      - "&7Sort for &fthis category &7only"
      - "&eLeft-click &7next option"
      - "&eRight-click &7previous option"
      - "&8"
      - "{modes}"
  close:
    material: OAK_DOOR
    name: "&cClose"
  clear:
    material: FIRE_CHARGE
    name: "&cClear Effect"
  balance:
    material: GOLD_NUGGET
    name: "&6Coins: &f{balance}"

texts:
  empty-effect:
    material: WHITE_STAINED_GLASS_PANE
    name: "&f "
  filter-mode-active: "&a▶ {label}"
  filter-mode-inactive: "&8  {label}"
  filter-modes:
    NONE: "None"
    NAME_ASC: "Name A → Z"
    NAME_DESC: "Name Z → A"
    PRICE_ASC: "Price ↑"
    PRICE_DESC: "Price ↓"
    FREE_FIRST: "Free first"
    UNLOCKED_FIRST: "Unlocked first"
    LOCKED_FIRST: "Locked first"
    AFFORDABLE_FIRST: "Affordable first"
    SELECTED_FIRST: "Selected first"
    HEAVY_FIRST: "Heavy first"
    ID_ASC: "ID A → Z"
  effect-item:
    name: "&b{name}"
    lore:
      - "{category}"
      - "{status}"
      - "{price}"
      - "{lock}"
    status-selected: "&aSelected"
    status-click: "&7Click to select"
    price-free: "&7Price: &aFree"
    price-paid: "&7Price: &f{price} coins"
    lock-unlocked: "&aUnlocked"
    lock-locked: "&cLocked"

